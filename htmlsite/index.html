<style>
  :root{
    --display: 'Italiana', serif;
    --script: 'Cormorant Garamond', serif;
    --body: 'Jost', system-ui, sans-serif;
    --ivory: #FBF7EE;
    --ivoryDeep: #F1E9D6;
    --primary: #1F3A2E;
    --primaryDeep: #132720;
    --accent: #B8933D;
    --accentLight: #D8BE7C;
    --secondary: #6E2A3B;
    --charcoal: #24261F;
    --muted: #6B6F5E;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; font-family:var(--body); background:var(--ivory); color:var(--charcoal); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  input, textarea{ font-family:inherit; }
  img{ max-width:100%; display:block; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  @keyframes riseIn{ from{ opacity:0; transform:translateY(18px);} to{ opacity:1; transform:translateY(0);} }
  .rise-in{ animation: riseIn .9s ease forwards; }

  @keyframes kenBurnsSlow{
    0%{ transform:scale(1.06) translate(0,0); }
    50%{ transform:scale(1.16) translate(-1.5%,-1%); }
    100%{ transform:scale(1.06) translate(0,0); }
  }
  .bg-alive{ animation:kenBurnsSlow 26s ease-in-out infinite; will-change:transform; }
  .bg-alive-slower{ animation:kenBurnsSlow 34s ease-in-out infinite; will-change:transform; }

  .gallery-tile{
    width: 100%;
    aspect-ratio: 1;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    border: none;
    padding: 0;
    background: var(--primary);
    display: block;
    min-width: 0;
  }
  .gallery-tile img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s ease; }
  .gallery-tile:hover img{ transform:scale(1.08); }

  @keyframes gmPulse {
    0%, 100% { transform: scale(0.92); opacity: 0.55; }
    50%      { transform: scale(1.04); opacity: 1; }
  }
  @keyframes gmRingSpin {
    to { transform: rotate(360deg); }
  }
  @keyframes gmShimmer {
    0%   { background-position: -150% 0; }
    100% { background-position: 150% 0; }
  }

  .gallery-photo-shell {
    position: relative;
    width: 100%;
    height: 100%;
    min-width: 0;
    overflow: hidden;
    background: #F1E9D6;
  }
  .gallery-photo-shell .gm-loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F1E9D6;
    z-index: 1;
    transition: opacity 0.22s ease;
  }
  .gallery-photo-shell .gm-loader::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 35%, rgba(184,147,61,0.22) 50%, transparent 65%);
    background-size: 250% 100%;
    animation: gmShimmer 2.4s ease-in-out infinite;
  }
  .gallery-photo-shell .gm-loader-mark {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1.5px solid #B8933D;
    background: rgba(251,247,238,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: gmPulse 1.7s ease-in-out infinite;
    z-index: 1;
  }
  .gallery-photo-shell .gm-loader-mark::after {
    content: '';
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 1.5px solid transparent;
    border-top-color: #B8933D;
    animation: gmRingSpin 1.3s linear infinite;
  }
  .gallery-photo-shell .gm-loader-mark span {
    font-family: 'Italiana', serif;
    font-size: 17px;
    letter-spacing: 1px;
    color: #1F3A2E;
  }
  .gallery-photo-shell img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 1;
    transition: opacity .25s ease;
  }
  .gallery-photo-shell.loaded img {
    opacity: 1;
  }
  .gallery-photo-shell .gm-loader {
    opacity: 0;
    pointer-events: none;
  }
  .gallery-photo-shell.loaded .gm-loader {
    opacity: 0;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .gallery-photo-shell .gm-loader::before,
    .gallery-photo-shell .gm-loader-mark,
    .gallery-photo-shell .gm-loader-mark::after { animation: none; }
  }

  .lock-card{
    background:#fff; border:1px dashed var(--accent); border-radius:16px; padding:40px 28px;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .rise-in, .bg-alive, .bg-alive-slower, .gallery-tile img{ animation:none !important; transition:none !important; }
    html{ scroll-behavior:auto; }
  }
</style>

function photos(folder, count, prefix, excluded = []){
  const list = [];
  for (let i = 1; i <= count; i++) {
    if (excluded.includes(i)) continue;
    list.push(`assets/${folder}/${prefix}${String(i).padStart(2,'0')}.jpeg`);

  return list;
}

      <h3 style="font-family:var(--display);font-weight:400;font-size:24px;color:${c.primary};text-align:center;margin:0 0 22px;">${section.title}</h3>

}
function galleryHTML(){
  let offset = 0;
  const blocks = GALLERY_SECTIONS.map(section => {
    const html = gallerySectionHTML(section, offset);
    offset += section.photos.length;
    return html;
  });
  return blocks.join('');
}

function openLightbox(index){ state.galleryIndex = index; renderLightbox(); }
function closeLightbox(){ state.galleryIndex = null; renderLightbox(); }
function stepLightbox(delta){
  const n = ALL_PHOTOS.length;
  state.galleryIndex = (state.galleryIndex + delta + n) % n;
  renderLightbox();
}
function renderLightbox(){
  const el = document.getElementById('lightbox');
  if (state.galleryIndex === null) { el.innerHTML = ''; return; }
  const src = ALL_PHOTOS[state.galleryIndex];
  const caption = ALL_CAPTIONS[state.galleryIndex];
  el.innerHTML = `
    <div id="lightboxOverlay" role="dialog" aria-modal="true" style="position:fixed;inset:0;background:rgba(19,39,32,0.94);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;">

      <button id="lbPrev" aria-label="Previous photo" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:${c.ivory};font-size:32px;padding:12px;">&#8249;</button>
      <button id="lbNext" aria-label="Next photo" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:${c.ivory};font-size:32px;padding:12px;">&#8250;</button>
      <div id="lbInner" style="max-width:90vw;max-height:90vh;text-align:center;">

        ${caption ? `<div style="font-family:var(--script);font-style:italic;font-size:20px;color:${c.accentLight};margin-top:16px;">${caption}</div>` : ''}
      </div>
    </div>`;
  document.getElementById('lightboxOverlay').addEventListener('click', closeLightbox);
  document.getElementById('lbInner').addEventListener('click', e => e.stopPropagation());
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); stepLightbox(-1); });
  document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); stepLightbox(1); });
}
document.addEventListener('keydown', e => {
  if (state.galleryIndex === null) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') stepLightbox(1);
  if (e.key === 'ArrowLeft') stepLightbox(-1);
});

/* ================================================================== */
/*  Countdown                                                           */
/* ================================================================== */
let countdownTimer = null;
function startCountdown(){
  if (countdownTimer) clearInterval(countdownTimer);
  const target = new Date(WEDDING_DATE_ISO).getTime();
  function tick(){
    const remaining = Math.max(target - Date.now(), 0);
    const totalSeconds = Math.floor(remaining / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    const box = document.getElementById('countdownBox');
    if (!box) return;
    if (remaining <= 0) {
      box.innerHTML = `<div style="font-family:var(--script);font-style:italic;font-size:26px;color:${c.accentLight};">It&rsquo;s the big day! See you there. \u{1F389}</div>`;
      return;
    }
    const blocks = [['Days', days], ['Hours', hours], ['Minutes', minutes], ['Seconds', seconds]];
    box.innerHTML = `<div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;">` +
      blocks.map(([label, value]) => `
        <div style="background:rgba(251,247,238,0.06);border:1px solid ${c.accent}55;border-radius:10px;padding:18px 14px;min-width:76px;text-align:center;backdrop-filter:blur(6px);">
          <div style="font-family:var(--display);font-size:clamp(28px,5vw,40px);color:${c.accentLight};line-height:1;">${String(value).padStart(2,'0')}</div>
          <div style="font-family:var(--body);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:${c.ivoryDeep};margin-top:8px;">${label}</div>
        </div>`).join('') + `</div>`;
  }
  tick();
  countdownTimer = setInterval(tick, 1000);
}

async function submitToSupabase(table, payload){
  if (!isSupabaseConfigured) return { error: 'not configured' };
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify(payload),
    });
    if (!res.ok) return { error: await res.text() };
    return { error: null };
  } catch (err) {
    return { error: String(err) };
  }
}

      <div><label style="${labelStyle()}">Phone</label>
        <input name="phone" style="${inputStyle()}" value="${escapeAttr(r.phone)}" placeholder="07XX XXX XXX"></div>
      <div><label style="${labelStyle()}">Email (optional)</label>
        <input name="email" type="email" style="${inputStyle()}" value="${escapeAttr(r.email)}" placeholder="you@example.com"></div>
    </div>
    <div><label style="${labelStyle()}">Will you attend?</label>
      <div style="display:flex;gap:10px;">
        <button type="button" data-attend="yes" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid ${c.primary};background:${r.attending==='yes'?c.primary:'transparent'};color:${r.attending==='yes'?c.ivory:c.primary};font-size:14px;">Joyfully Accept</button>
        <button type="button" data-attend="no" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid ${c.primary};background:${r.attending==='no'?c.primary:'transparent'};color:${r.attending==='no'?c.ivory:c.primary};font-size:14px;">Regretfully Decline</button>
      </div>
    </div>
    ${r.attending === 'yes' ? `<div><label style="${labelStyle()}">Number of Guests</label>
      <input name="guestCount" type="number" min="1" max="10" style="${inputStyle()}" value="${r.guestCount}"></div>` : ''}
    <div><label style="${labelStyle()}">Message (optional)</label>
      <textarea name="message" style="${inputStyle()};min-height:80px;resize:vertical;" placeholder="Any dietary notes or well-wishes">${r.message}</textarea></div>
    ${r.status === 'error' ? `<div style="color:${c.secondary};font-size:13px;">Something went wrong &mdash; please try again.</div>` : ''}
    ${r.status === 'needs-pledge' ? `<div style="color:${c.secondary};font-size:13px;text-align:center;">Almost there &mdash; please make your pledge first, then come straight back here. <a href="#pledge" style="color:${c.primary};text-decoration:underline;">Go to Pledge</a></div>` : ''}
    <button type="submit" ${!isSupabaseConfigured ? 'disabled' : ''} style="background:${c.accent};color:${c.primaryDeep};border:none;border-radius:999px;padding:13px;font-size:14px;letter-spacing:1px;font-weight:600;text-transform:uppercase;opacity:${r.status==='submitting'?0.7:1};">
      ${r.status === 'submitting' ? 'Sending\u2026' : 'RSVP for the Wedding'}
    </button>
  </form>`;
}

function attachFormHandlers(){
  const pledgeForm = document.getElementById('pledgeForm');
  if (pledgeForm) {
    pledgeForm.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(pledgeForm);
      state.pledge.fullName = fd.get('fullName') || '';
      state.pledge.phone = fd.get('phone') || '';
      state.pledge.amount = fd.get('amount') || '';
      state.pledge.message = fd.get('message') || '';
      state.pledge.status = 'submitting';
      renderPledgeSection();
      const { error } = await submitToSupabase('pledges', {
        full_name: state.pledge.fullName, phone: state.pledge.phone,
        amount: Number(state.pledge.amount), message: state.pledge.message,
      });
      state.pledge.status = error ? 'error' : 'success';
      if (!error) {
        state.pledgeMade = true;
        localStorage.setItem('pledgeMade', 'true');
        renderRsvpSection();
        updateRsvpVisibility();
      }
      renderPledgeSection();
    });
  }
  const rsvpForm = document.getElementById('rsvpForm');
  if (rsvpForm) {
    rsvpForm.querySelectorAll('[data-attend]').forEach(btn => {
      btn.addEventListener('click', () => { state.rsvp.attending = btn.dataset.attend; renderRsvpSection(); });
    });
    rsvpForm.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(rsvpForm);
      state.rsvp.fullName = fd.get('fullName') || '';
      state.rsvp.phone = fd.get('phone') || '';
      state.rsvp.email = fd.get('email') || '';
      state.rsvp.message = fd.get('message') || '';
      state.rsvp.guestCount = Number(fd.get('guestCount')) || 1;
      if (!state.pledgeMade) {
        state.rsvp.status = 'needs-pledge';
        renderRsvpSection();
        return;
      }
      state.rsvp.status = 'submitting';
      renderRsvpSection();
      const { error } = await submitToSupabase('rsvps', {
        full_name: state.rsvp.fullName, phone: state.rsvp.phone, email: state.rsvp.email,
        attending: state.rsvp.attending, guest_count: state.rsvp.guestCount, message: state.rsvp.message,
      });
      state.rsvp.status = error ? 'error' : 'success';
      renderRsvpSection();
    });
  }
}
function renderPledgeSection(){
  document.getElementById('pledgeFormWrap').innerHTML = pledgeFormHTML();
  attachFormHandlers();
}
function renderRsvpSection(){
  document.getElementById('rsvpFormWrap').innerHTML = rsvpFormHTML();
  attachFormHandlers();
}
function updateRsvpVisibility(){
  const rsvpSection = document.getElementById('rsvp');
  const rsvpLink = document.querySelector('a[href="#rsvp"]');
  if (rsvpSection) rsvpSection.style.display = state.pledgeMade ? '' : 'none';
  if (rsvpLink) rsvpLink.style.display = state.pledgeMade ? '' : 'none';
}
